# Deploys the repo to GitHub Pages as plain static files.
#
# The legacy Pages builder had been failing every build since 98f58d7 with only
# "Page build failed." and no log to work from, and .nojekyll did not change it.
# This is the supported path: no Jekyll, no content processing, and a real run
# log when something does go wrong.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
